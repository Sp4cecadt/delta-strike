<script>
(()=>{'use strict';
const W=160,H=256,ROW=8,S=96,PY=40;
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(touch)document.body.classList.add('touch');
const C={land:'#4d7a22',land2:'#5e8c2a',edge:'#a89a50',water:'#2a50c4',water2:'#5078e8',tree:'#1f4410',tree2:'#2e6018',trunk:'#5a3a18',road:'#4a4a52',dash:'#e8c040',hud:'#0b0d1e',txt:'#f0e8c8',dim:'#8088b8',red:'#ff4a3a',yel:'#ffd040',grn:'#58e070'};
// ---------- utils
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(n){n=(n^61)^(n>>>16);n=n+(n<<3)|0;n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return n>>>0}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
// ---------- pixel font 3x5
const F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','-':'000000111000000','.':'000000000000010','!':'010010010000010',':':'000010000010000','/':'001001010100100','>':'100010001010100','+':'000010111010000','=':'000111000111000'};
function txt(s,x,y,col,sc=1,al,sh=true){s=String(s).toUpperCase();const w=s.length*4*sc-sc;if(al==='c')x=Math.round(x-w/2);else if(al==='r')x-=w;
 const pass=(ox,oy,c)=>{cx.fillStyle=c;let X=x+ox;for(const ch of s){const g=F[ch];if(g)for(let i=0;i<15;i++)if(g[i]==='1')cx.fillRect(X+(i%3)*sc,y+oy+((i/3)|0)*sc,sc,sc);X+=4*sc}};
 if(sh)pass(sc>1?1:1,sc>1?1:1,'#000');pass(0,0,col)}
// ---------- sprites (original pixel art)
function mk(rows,pal,flip){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][flip?w-1-x:x];if(ch!=='.'){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}return c}
const SP={};
const PJ=["....a....","....a....","...aba...","...aaa...",".aaaaaaa.","aaaaaaaaa","a..aaa..a","...aaa...","..aaaaa..","..c...c.."];
const PJB=["....a....","....a....","...aba...","...aaa...","..aaaaa..",".aaaaaaa.","..aaaa...","...aaa...","...aaaa..","...c..c.."];
const pjp={a:'#f4c430',b:'#4fd0ff',c:'#ff7020'},pjp2={a:'#f4c430',b:'#4fd0ff',c:'#ffe060'};
SP.pj=mk(PJ,pjp);SP.pj2=mk(PJ,pjp2);SP.pjL=mk(PJB,pjp,true);SP.pjR=mk(PJB,pjp);SP.pjL2=mk(PJB,pjp2,true);SP.pjR2=mk(PJB,pjp2);
const BOAT=["........dd......",".......ddd......","....eeeeeeee....","aaaaaaaaaaaaaaa.",".aaaaaaaaaaaaa..","..bbbbbbbbbbb..."];
const bp={a:'#a8aeb8',b:'#5a6068',d:'#f8f8f8',e:'#e07028'};SP.boatR=mk(BOAT,bp);SP.boatL=mk(BOAT,bp,true);
const HE1=["rrrrrrrrrr..","....gg......","t..ggggg....","tggggggwg...","t..gggggg...","....g..g....","...gggggg..."];
const HE2=["..rrrrrr....","....gg......","t..ggggg....","tggggggwg...","t..gggggg...","....g..g....","...gggggg..."];
const hp={r:'#d8d8d8',g:'#c84ac0',w:'#80e8ff',t:'#e888e0'};
SP.heR1=mk(HE1,hp);SP.heR2=mk(HE2,hp);SP.heL1=mk(HE1,hp,true);SP.heL2=mk(HE2,hp,true);
const JET=["...j........","..jjj...j...","jjjjjjjjjjjw","..jjj...j...","...j........"];
const jp={j:'#e8f0ff',w:'#ff4040'};SP.jetR=mk(JET,jp);SP.jetL=mk(JET,jp,true);
const FUEL=["...kkkk...",".kkwwwwkk.","kwwwwwwwwk","krrrrrrrrk","kwwwbbwwwk","kwwbbbbwwk","kwwbbbbwwk","kwwwbbwwwk","krrrrrrrrk","kwwwwwwwwk",".kkwwwwkk.","...kkkk...","..k....k..",".kkk..kkk."];
SP.fuel=mk(FUEL,{k:'#303040',w:'#f0f0f0',r:'#e03030',b:'#3090ff'});
SP.tree=mk([".ttt.","ttTtt","tTttt",".ttt.","..u.."],{t:C.tree,T:C.tree2,u:C.trunk});
SP.mini=mk(["..a..",".aaa.","aaaaa","..a..",".aaa."],{a:'#f4c430'});
const SZ={boat:[16,6],heli:[12,7],jet:[12,5],fuel:[10,14]};
const PTS={boat:40,heli:70,jet:120,fuel:90,bridge:600};
// ---------- river generation
const DEF={l:64,r:96,il:0,ir:0,t1:-1,t2:-1,road:0};
const cache=new Map();
function chan(row,side){if(!row.il)return[row.l,row.r];return side?[row.ir,row.r]:[row.l,row.il]}
function gen(k){let s=cache.get(k);if(s)return s;
 const r=rng(k*7919+1013);const rows=new Array(S);let c=80,hw=16,tc=80,thw=16,seg=0,isl=false;
 const minHw=Math.max(18,44-k*5);
 for(let i=0;i<S;i++){
  if(i<6||i>=S-12){tc=80;thw=16;isl=false;seg=1}
  else if(--seg<=0){seg=4+(r()*6|0);thw=minHw+((r()*((68-minHw)/4+1))|0)*4;thw=Math.min(thw,68);
   const mn=thw+6,mx=W-thw-6;tc=mx>mn?mn+((r()*((mx-mn)/4+1))|0)*4:80;isl=thw>=44&&r()<0.5}
  if(c<tc)c+=4;else if(c>tc)c-=4;if(hw<thw)hw+=4;else if(hw>thw)hw-=4;
  const l=Math.max(6,c-hw),rr=Math.min(W-6,c+hw);let iw=0;if(isl&&hw>=44)iw=Math.floor((hw-26)/4)*4;
  const row={l,r:rr,il:iw?c-iw:0,ir:iw?c+iw:0,t1:-1,t2:-1,t3:-1,road:i===S-5?1:0};
  if(l>22&&r()<0.4)row.t1=2+(r()*(l-18)|0);
  if(rr<W-22&&r()<0.4)row.t2=rr+10+(r()*(W-rr-18)|0);
  if(iw>=12&&r()<0.5)row.t3=c-2+(((r()*2|0)*2-1)*(r()*(iw-8)|0));
  rows[i]=row}
 const sp=[];const gap=Math.max(4,8-(k>>1));let i=k===0?16:12;
 while(i<S-16){const roll=r();const pf=k<1?0.2:0.15;let t;
  if(roll<pf)t='fuel';else if(k>=1&&roll<pf+Math.min(0.06+0.03*k,0.22))t='jet';else t=r()<0.5?'boat':'heli';
  const [w,h]=SZ[t];
  if(t==='jet'){const d=r()<0.5?1:-1;sp.push({t,x:d>0?-14:W+2,gi:i,w,h,vx:d*(48+Math.min(k*5,40)),mover:true})}
  else{const nr=Math.ceil((h+1)/8);const side=r()<0.5?0:1;let a=0,b=W;
   for(let j=0;j<nr;j++){const q=chan(rows[i+j],side);a=Math.max(a,q[0]);b=Math.min(b,q[1])}
   if(b-a<w+4){i+=2;continue}
   const mover=t!=='fuel'&&r()<Math.min(0.15+0.12*k,0.85);const spd=(18+Math.min(k*5,40)+r()*14)*(r()<0.5?-1:1);
   sp.push({t,x:a+2+r()*(b-a-w-4),gi:i,w,h,vx:spd,mover})}
  i+=gap+(r()*4|0)}
 s={rows,sp};cache.set(k,s);
 for(const key of cache.keys())if(key<k-3)cache.delete(key);
 return s}
function rowAt(gi){if(gi<0)return DEF;const k=Math.floor(gi/S);return gen(k).rows[gi-k*S]}
// ---------- audio
let AC=null,eng=null,engG=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('deltaStrikeMute')==='1'}catch(e){}
function unlock(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  eng=AC.createOscillator();eng.type='sawtooth';const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;engG=AC.createGain();engG.gain.value=0;eng.connect(lp);lp.connect(engG);engG.connect(AC.destination);eng.frequency.value=55;eng.start();
  const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}
 if(AC.state!=='running')AC.resume()}catch(e){}}
function tone(f,d,type='square',v=0.08,f2,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}
function noise(d,v=0.3,fq=900){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(fq,t);f.frequency.exponentialRampToValueAtTime(60,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d)}
const sfx={shoot:()=>tone(1200,0.09,'square',0.05,180),boom:()=>{noise(0.45,0.35,1400);tone(140,0.35,'triangle',0.18,40)},big:()=>{noise(1.1,0.5,1800);tone(90,0.9,'triangle',0.25,30)},
 crash:()=>{noise(1.3,0.5,2200);tone(300,1.0,'sawtooth',0.12,30)},fuel:f=>tone(300+f*700,0.05,'square',0.035),alarm:()=>tone(880,0.09,'square',0.05),
 life:()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.12,'square',0.06,0,i*0.09)),start:()=>[392,523,659,784,659,784].forEach((f,i)=>tone(f,0.1,'square',0.05,0,i*0.08)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,0.22,'triangle',0.12,0,i*0.2))};
function engine(on,spd){if(!engG)return;const t=AC.currentTime;engG.gain.setTargetAtTime(on&&!muted?0.035:0,t,0.05);if(on)eng.frequency.setTargetAtTime(38+spd*0.45,t,0.08)}
// ---------- input
const K={l:0,r:0,u:0,d:0,f:0};const T={steer:0,spd:0,fire:0};
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',Space:'f',KeyJ:'f',KeyZ:'f'};
addEventListener('keydown',e=>{unlock();const m=km[e.code];if(m){K[m]=1;e.preventDefault();if(m==='f')press()}
 else if(e.code==='Enter')press();else if(e.code==='KeyP'||e.code==='Escape')togglePause();else if(e.code==='KeyM')toggleMute()});
addEventListener('keyup',e=>{const m=km[e.code];if(m)K[m]=0});
['touchstart','touchmove','gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault()},{passive:false}));
document.addEventListener('touchend',e=>{unlock();e.preventDefault()},{passive:false});
const pad=$('pad'),knob=$('knob');let padId=null;
function padMove(e){const b=pad.getBoundingClientRect(),R=b.width/2;let dx=(e.clientX-b.left-R)/R,dy=(e.clientY-b.top-R)/R;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
 T.steer=Math.abs(dx)<0.12?0:clamp((dx-Math.sign(dx)*0.12)/0.5,-1,1);T.spd=dy<-0.45?1:dy>0.45?-1:0;knob.style.transform="translate("+(dx*R*0.6)+"px,"+(dy*R*0.6)+"px)"}
pad.addEventListener('pointerdown',e=>{e.preventDefault();unlock();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}padMove(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e)});
const padEnd=e=>{if(e.pointerId===padId){padId=null;T.steer=0;T.spd=0;knob.style.transform=''}};
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,padEnd));
const fb=$('fire');let fireIds=new Set();
fb.addEventListener('pointerdown',e=>{e.preventDefault();unlock();fireIds.add(e.pointerId);T.fire=1;fb.classList.add('on');press()});
const fEnd=e=>{fireIds.delete(e.pointerId);if(!fireIds.size){T.fire=0;fb.classList.remove('on')}};
['pointerup','pointercancel','pointerleave'].forEach(ev=>fb.addEventListener(ev,fEnd));
$('pauseB').addEventListener('pointerdown',e=>{e.preventDefault();unlock();togglePause()});
$('muteB').addEventListener('pointerdown',e=>{e.preventDefault();unlock();toggleMute()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.st==='paused')togglePause();else press()});
function toggleMute(){muted=!muted;try{localStorage.setItem('deltaStrikeMute',muted?'1':'0')}catch(e){}$('muteB').textContent=muted?'MUTED':'SOUND';if(muted)engine(false)}
$('muteB').textContent=muted?'MUTED':'SOUND';
function togglePause(){if(G.st==='play'){G.st='paused';engine(false);$('pauseB').textContent='PLAY'}else if(G.st==='paused'){G.st='play';$('pauseB').textContent='PAUSE';last=performance.now()}}

addEventListener('blur',()=>{if(G.st==='play')togglePause()});
// ---------- game state

const G={st:'title',score:0,lives:3,fuel:1,cam:0,px:80,vx:0,vy:72,cp:0,zone:0,ents:[],spawned:0,bullet:null,parts:[],timer:0,msg:'',msgT:0,nextLife:10000,fuelT:0,alarmT:0,tick:0,newHi:false,refuel:false};
window.DS=G;G.gen=gen;G.rowAt=rowAt;G.K=K;G.T=T;
function spawnSec(k){const s=gen(k);for(const p of s.sp)G.ents.push({t:p.t,x:p.x,y:(k*S+p.gi)*ROW+1,w:p.w,h:p.h,vx:p.vx,mover:p.mover,act:false,a:0});
 const br=s.rows[S-5];G.ents.push({t:'bridge',x:br.l,y:(k*S+S-5)*ROW,w:br.r-br.l,h:ROW,sec:k})}
function ensure(){while(G.spawned*S*ROW<G.cam+H+96){spawnSec(G.spawned);G.spawned++}
 G.ents=G.ents.filter(e=>!e.dead&&e.y+e.h>G.cam-24)}
function placeAt(k){G.cam=k*S*ROW+ROW-PY;G.px=80;G.vx=0;G.vy=72;G.ents=[];G.spawned=k;G.bullet=null;G.fuel=1;G.zone=k;ensure()}
function newGame(){G.score=0;G.lives=3;G.cp=0;G.nextLife=10000;G.parts=[];G.newHi=false;placeAt(0);G.st='play';G.msg='ZONE 1';G.msgT=2;sfx.start();$('pauseB').textContent='PAUSE'}
function press(){if(G.st==='title')newGame();else if(G.st==='over'&&G.timer<=0)newGame()}
function addScore(n){G.score+=n;if(G.score>=G.nextLife){G.nextLife+=10000;if(G.lives<9){G.lives++;sfx.life();G.msg='BONUS JET';G.msgT=1.5}}}
function explode(x,y,n,cols,sp=60){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0.4+Math.random()*0.6,c:cols[i%cols.length],s:Math.random()<0.3?2:1})}}
function die(){if(G.st!=='play')return;G.st='dead';G.timer=1.8;engine(false);sfx.crash();explode(G.px,G.cam+PY+5,60,['#fff','#ffd040','#ff7020','#ff3020','#888'],80)}
function hit(e){e.dead=true;addScore(PTS[e.t]);const cxx=e.x+e.w/2,cyy=e.y+e.h/2;
 if(e.t==='bridge'){sfx.big();for(let x=e.x;x<e.x+e.w;x+=4)explode(x,cyy,6,['#fff','#ffd040','#ff7020','#555'],50);G.cp=e.sec+1;G.msg='ZONE '+(e.sec+2);G.msgT=2;G.flash=0.15}
 else{sfx.boom();explode(cxx,cyy,22,e.t==='fuel'?['#fff','#e03030','#3090ff','#ffd040']:['#fff','#ffd040','#ff7020','#ff3020'])}}
function inWater(x0,x1,wy){const row=rowAt(Math.floor(wy/ROW));if(x0<row.l||x1>row.r)return false;if(row.il&&x1>row.il&&x0<row.ir)return false;return true}
function step(dt){G.tick++;
 for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;p.l-=dt}G.parts=G.parts.filter(p=>p.l>0);
 if(G.msgT>0)G.msgT-=dt;if(G.flash>0)G.flash-=dt;
 if(G.st==='title'){G.cam+=26*dt;ensure();moveEnts(dt);return}
 if(G.st==='dead'){G.timer-=dt;if(G.timer<=0){G.lives--;if(G.lives<=0){G.st='over';G.timer=1.2;if(G.score>hi){hi=G.score;G.newHi=true;try{localStorage.setItem('deltaStrikeHi',hi)}catch(e){}}sfx.over()}else{placeAt(G.cp);G.st='play';G.msg='READY';G.msgT=1.2}}moveEnts(dt);return}
 if(G.st==='over'){G.timer-=dt;return}
 if(G.st!=='play')return;
 const steer=clamp((K.r-K.l)+T.steer,-1,1),sp=clamp((K.u-K.d)+T.spd,-1,1);
 const tvy=sp>0?130:sp<0?40:72;G.vy+=(tvy-G.vy)*Math.min(1,dt*3);
 G.vx+=(steer*92-G.vx)*Math.min(1,dt*10);G.px=clamp(G.px+G.vx*dt,4,W-4);
 G.cam+=G.vy*dt;ensure();engine(true,G.vy);
 // fuel
 G.fuel-=dt*0.034*(0.7+G.vy/240);G.refuel=false;
 // bullet
 if((K.f||T.fire)&&!G.bullet){G.bullet={x:G.px-1,y:G.cam+PY+10};sfx.shoot()}
 if(G.bullet){G.bullet.y+=(300+G.vy)*dt;if(G.bullet.y>G.cam+H)G.bullet=null}
 moveEnts(dt);
 const py=G.cam+PY,pl=G.px-3,pr=G.px+3;
 for(const e of G.ents){if(e.dead)continue;
  const b=G.bullet;if(b&&b.x+2>e.x&&b.x<e.x+e.w&&b.y+6>e.y&&b.y<e.y+e.h){G.bullet=null;hit(e);continue}
  if(pr>e.x+1&&pl<e.x+e.w-1&&py+9>e.y+1&&py+1<e.y+e.h-1){if(e.t==='fuel'){G.refuel=true}else{if(e.t!=='bridge'){e.dead=true;explode(e.x+e.w/2,e.y+e.h/2,16,['#fff','#ff7020'])}die();return}}}
 if(G.refuel){G.fuel=Math.min(1,G.fuel+dt*0.42);G.fuelT-=dt;if(G.fuelT<=0&&G.fuel<1){G.fuelT=0.07;sfx.fuel(G.fuel)}}
 if(G.fuel<0.25&&!G.refuel){G.alarmT-=dt;if(G.alarmT<=0){G.alarmT=0.45;sfx.alarm()}}
 if(G.fuel<=0){G.fuel=0;die();return}
 if(!inWater(pl,pr,py+2)||!inWater(pl,pr,py+8)||!inWater(G.px-1,G.px+1,py+10)){die();return}
 const z=Math.floor((py)/ROW/S);if(z>G.zone)G.zone=z}
function moveEnts(dt){for(const e of G.ents){if(e.dead||e.t==='bridge'||e.t==='fuel')continue;e.a+=dt;
 const s=H-(e.y-G.cam);if(s<-4)continue;
 if(e.t==='jet'){e.x+=e.vx*dt;if(e.vx>0&&e.x>W+4)e.x=-16;if(e.vx<0&&e.x<-16)e.x=W+4;continue}
 if(!e.mover)continue;if(!e.act&&s<70)continue;e.act=true;
 const nx=e.x+e.vx*dt;if(inWater(nx-1,nx+e.w+1,e.y+1)&&inWater(nx-1,nx+e.w+1,e.y+e.h-1))e.x=nx;else e.vx=-e.vx}}
// ---------- render
const sy=wy=>Math.round(H-(wy-G.cam));
function drawWorld(){cx.fillStyle=C.land;cx.fillRect(0,0,W,H);
 const g0=Math.floor(G.cam/ROW)-1,g1=Math.floor((G.cam+H)/ROW)+1;
 for(let gi=g0;gi<=g1;gi++){const r=rowAt(gi),y=sy((gi+1)*ROW);
  if((gi&3)===0){cx.fillStyle=C.land2;cx.fillRect(0,y,W,1)}
  cx.fillStyle=C.edge;cx.fillRect(r.l-2,y,r.r-r.l+4,ROW);
  cx.fillStyle=C.water;cx.fillRect(r.l,y,r.r-r.l,ROW);
  if(r.il){cx.fillStyle=C.edge;cx.fillRect(r.il,y,r.ir-r.il,ROW);cx.fillStyle=C.land;cx.fillRect(r.il+2,y,r.ir-r.il-4,ROW)}
  const h=hsh(gi+99991);if(h%3===0){const span=r.r-r.l-6;if(span>0){let x=r.l+3+((h>>3)+((G.tick*0.35)|0))%span;if(!(r.il&&x+4>r.il&&x<r.ir)){cx.fillStyle=C.water2;cx.fillRect(x,y+((h>>9)&7),3,1)}}}
  if(r.road){cx.fillStyle=C.road;cx.fillRect(0,y,r.l-2,ROW);cx.fillRect(r.r+2,y,W-r.r-2,ROW);cx.fillStyle=C.dash;for(let x=2;x<W;x+=8)if(x+4<r.l-2||x>r.r+2)cx.fillRect(x,y+3,4,1)}}
 for(let gi=g0;gi<=g1;gi++){const r=rowAt(gi),y=sy((gi+1)*ROW);if(r.road)continue;
  if(r.t1>=0)cx.drawImage(SP.tree,r.t1,y+1);if(r.t2>=0)cx.drawImage(SP.tree,r.t2,y+1);if(r.t3>=0&&r.il)cx.drawImage(SP.tree,r.t3,y+1)}}
function drawEnts(){for(const e of G.ents){if(e.dead)continue;const x=Math.round(e.x),y=sy(e.y+e.h);if(y>H+10||y<-20)continue;
 if(e.t==='bridge'){cx.fillStyle='#6a6a74';cx.fillRect(x,y,e.w,e.h);cx.fillStyle='#2c2c34';cx.fillRect(x,y,e.w,1);cx.fillRect(x,y+7,e.w,1);cx.fillStyle=C.dash;for(let i=x+2;i<x+e.w-3;i+=6)cx.fillRect(i,y+3,3,1);cx.fillStyle='#9a9aa4';for(let i=x;i<x+e.w;i+=5)cx.fillRect(i,y+1,1,1)}
 else if(e.t==='boat')cx.drawImage(e.vx>0?SP.boatR:SP.boatL,x,y);
 else if(e.t==='heli'){const f=((e.a*14)|0)&1;cx.drawImage(e.vx>0?(f?SP.heR1:SP.heR2):(f?SP.heL1:SP.heL2),x,y)}
 else if(e.t==='jet')cx.drawImage(e.vx>0?SP.jetR:SP.jetL,x,y);
 else if(e.t==='fuel')cx.drawImage(SP.fuel,x,y)}}
function drawPlayer(){if(G.st!=='play'&&G.st!=='paused')return;const f=(G.tick>>2)&1;const st=G.vx<-30?'L':G.vx>30?'R':'';
 const im=st==='L'?(f?SP.pjL:SP.pjL2):st==='R'?(f?SP.pjR:SP.pjR2):(f?SP.pj:SP.pj2);cx.drawImage(im,Math.round(G.px-4),H-PY-10);
 if(G.bullet){cx.fillStyle='#fff6a0';cx.fillRect(Math.round(G.bullet.x),sy(G.bullet.y+6),2,6)}}
function drawParts(){for(const p of G.parts){cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),sy(p.y),p.s,p.s)}}
function pad6(n){return String(n).padStart(6,'0')}
function drawHud(){cx.fillStyle='rgba(11,13,30,0.85)';cx.fillRect(0,0,W,9);txt(pad6(G.score),3,2,C.txt);txt('HI '+pad6(Math.max(hi,G.score)),W-3,2,C.dim,1,'r');txt('Z'+(G.zone+1),W/2,2,C.yel,1,'c');
 cx.fillStyle='rgba(11,13,30,0.85)';cx.fillRect(0,H-12,W,12);txt('E',4,H-9,C.red);
 const bw=86;cx.fillStyle='#2a2e50';cx.fillRect(10,H-9,bw,5);const fw=Math.round(bw*G.fuel);cx.fillStyle=G.fuel<0.25?((G.tick>>3)&1?C.red:'#802018'):G.fuel<0.5?C.yel:C.grn;cx.fillRect(10,H-9,fw,5);
 cx.fillStyle='#fff';cx.fillRect(10+bw/2,H-10,1,7);txt('F',99,H-9,C.grn);
 for(let i=0;i<Math.min(G.lives-(G.st==='play'||G.st==='paused'?1:0),6);i++)cx.drawImage(SP.mini,W-8-i*7,H-10)}
function drawOverlay(){
 if(G.msgT>0&&(G.st==='play')&&((G.tick>>3)&1||G.msgT<1.2))txt(G.msg,W/2,90,C.yel,2,'c');
 if(G.flash>0){cx.fillStyle='rgba(255,255,255,0.35)';cx.fillRect(0,0,W,H)}
 if(G.st==='title'){cx.fillStyle='rgba(8,10,28,0.72)';cx.fillRect(0,0,W,H);txt('DELTA',W/2,34,C.yel,4,'c');txt('STRIKE',W/2,58,'#ff7a4a',4,'c');
  txt('RIVER RUN SHOOTER',W/2,84,C.dim,1,'c');
  const L=[[SP.boatR,'BOAT',40],[SP.heR1,'CHOPPER',70],[SP.jetR,'JET',120],[SP.fuel,'FUEL TANK',90]];let y=100;
  for(const [im,n,p] of L){cx.drawImage(im,26,y);txt(n,48,y+2,C.txt);txt(String(p),136,y+2,C.yel,1,'r');y+=im.height+6}
  cx.fillStyle='#6a6a74';cx.fillRect(22,y,20,6);cx.fillStyle=C.dash;cx.fillRect(25,y+2,3,1);cx.fillRect(31,y+2,3,1);cx.fillRect(37,y+2,3,1);txt('BRIDGE',48,y+1,C.txt);txt('600',136,y+1,C.yel,1,'r');
  txt('FLY OVER TANKS TO REFUEL',W/2,y+16,C.grn,1,'c');txt('BRIDGES ARE CHECKPOINTS',W/2,y+24,C.dim,1,'c');
  if((G.tick>>4)&1)txt(touch?'TAP FIRE TO START':'PRESS ENTER OR SPACE',W/2,214,C.txt,1,'c');
  txt('HI '+pad6(hi),W/2,228,C.dim,1,'c');if(!touch)txt('ARROWS/WASD  SPACE  P  M',W/2,240,'#5860a0',1,'c')}
 if(G.st==='paused'){cx.fillStyle='rgba(8,10,28,0.6)';cx.fillRect(0,0,W,H);txt('PAUSED',W/2,100,C.yel,3,'c');txt(touch?'TAP TO RESUME':'PRESS P TO RESUME',W/2,130,C.txt,1,'c')}
 if(G.st==='over'){cx.fillStyle='rgba(8,10,28,0.7)';cx.fillRect(0,0,W,H);txt('GAME',W/2,70,C.red,4,'c');txt('OVER',W/2,94,C.red,4,'c');txt('SCORE '+pad6(G.score),W/2,130,C.txt,1,'c');txt('REACHED ZONE '+(G.zone+1),W/2,140,C.dim,1,'c');
  if(G.newHi&&(G.tick>>3)&1)txt('NEW HIGH SCORE!',W/2,154,C.yel,1,'c');if(G.timer<=0&&(G.tick>>4)&1)txt(touch?'TAP FIRE TO PLAY AGAIN':'PRESS ENTER TO PLAY AGAIN',W/2,180,C.txt,1,'c')}}
function render(){drawWorld();drawEnts();drawPlayer();drawParts();drawHud();drawOverlay()}
// ---------- sizing & loop
function resize(){const st=$('stage');const w=st.clientWidth,h=st.clientHeight;let s=Math.min(w/W,h/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
let last=performance.now(),acc=0;const DT=1/60;
function frame(now){let d=(now-last)/1000;last=now;if(d>0.25)d=0.25;acc+=d;let n=0;while(acc>=DT&&n<6){step(DT);acc-=DT;n++}if(n>=6)acc=0;render();G.frames=(G.frames||0)+1;requestAnimationFrame(frame)}
ensure();requestAnimationFrame(frame);
})();
</script>
</body></html>
